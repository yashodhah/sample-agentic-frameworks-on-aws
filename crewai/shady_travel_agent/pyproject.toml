[project]
name = "shady_travel_agent"
version = "0.1.0"
description = "shady-travel-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.2.0"
]

[project.scripts]
shady_travel_agent = "shady_travel_agent.main:run"
run_crew = "shady_travel_agent.main:run"
train = "shady_travel_agent.main:train"
replay = "shady_travel_agent.main:replay"
test = "shady_travel_agent.main:test"
run_with_trigger = "shady_travel_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
